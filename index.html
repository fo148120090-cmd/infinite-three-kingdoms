<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0b1020"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>무한삼국지: 천탑전기</title>
<style>
html,body,#root{margin:0;min-height:100%;background:#0b0f16}*{box-sizing:border-box}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{-webkit-font-smoothing:antialiased;overscroll-behavior:none}
@media(max-width:640px){
 body{font-size:14px}button{min-height:42px}
 .battle-grid{gap:3px!important}.battle-grid button{min-height:58px!important;padding:4px!important;font-size:12px}
 .battle-actions{position:sticky;bottom:0;z-index:5;padding:8px!important;background:rgba(11,15,22,.96);backdrop-filter:blur(8px)}
 .mobile-nav{position:sticky;top:0;z-index:6;padding:6px!important;background:rgba(11,15,22,.96);backdrop-filter:blur(8px)}
 .mobile-card{padding:10px!important}.mobile-resource{font-size:12px}
 .tower-tile-move{box-shadow:inset 0 0 0 2px #4da3ff,0 0 10px rgba(77,163,255,.35)!important;background:#173454!important}
 .tower-tile-attack{box-shadow:inset 0 0 0 2px #ff5c69,0 0 10px rgba(255,92,105,.35)!important;background:#4a2028!important}
 .tower-tile-selected{box-shadow:inset 0 0 0 3px #ffd54a,0 0 12px rgba(255,213,74,.35)!important}
 .tower-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:8px 0;color:#b9c3d3}
 .tower-legend span{padding:5px 8px;border-radius:999px;background:#151b25}.tower-legend .mv{border:1px solid #4da3ff}.tower-legend .at{border:1px solid #ff5c69}.tower-legend .sel{border:1px solid #ffd54a}
 .tower-settings{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:1000;width:44px;height:44px;min-height:44px;border:1px solid #3b465b;border-radius:50%;background:#111827;color:#fff;font-size:20px;box-shadow:0 5px 20px rgba(0,0,0,.35)}
 .tower-settings-modal{position:fixed;inset:0;z-index:999;background:rgba(3,6,12,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px}
 .tower-settings-panel{width:min(520px,100%);max-height:82vh;overflow:auto;background:#111827;border:1px solid #344057;border-radius:18px;padding:16px;color:#eef3fb;box-shadow:0 20px 60px rgba(0,0,0,.5)}
 .tower-settings-panel h2{margin:0 0 12px}.tower-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .tower-settings-stat{padding:10px;border-radius:10px;background:#182132;border:1px solid #29364b}.tower-settings-stat small{display:block;color:#9aa6b8}
 .tower-settings-close,.tower-settings-reset{width:100%;margin-top:10px;border-radius:10px;padding:11px;border:1px solid #39465b;background:#192235;color:#fff}
 .tower-settings-reset{border-color:#8a4650;background:#3a1f25}.tower-settings-note{color:#9aa6b8;font-size:13px;line-height:1.5}
}
</style>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
